name: Build APK (Heldonica Mobile 0€)

on:
  workflow_dispatch:
  # Appelé par `release-apk.yml` pour produire l'APK publié. Le build est le même
  # que celui de la CI : `cms.password=` reste vide, donc aucun secret n'est compilé
  # dans le dex. `mot_de_passe_vide` est publié en sortie pour que le workflow
  # appelant puisse refuser de publier un APK qui aurait embarqué un identifiant.
  workflow_call:
    # `publier` distingue l'appel de release-apk.yml (qui publie) d'un appel de
    # validation. On ne se fie pas a `github.event_name` : dans un workflow
    # reutilisable appele, il reflete l'evenement de l'appelant, pas
    # `workflow_call`. Un drapeau explicite ne depend d'aucune subtilite.
    inputs:
      publier:
        description: "true pour l'appel de release-apk.yml, qui publie l'APK"
        type: boolean
        default: false
    outputs:
      mot_de_passe_vide:
        description: "'true' si aucun mot de passe n'a été compilé dans l'APK"
        value: ${{ jobs.build.outputs.mot_de_passe_vide }}
  pull_request:
    paths:
      - "heldonica-mobile/**"
      - ".github/workflows/build-apk.yml"
  push:
    paths:
      - "heldonica-mobile/**"
      - ".github/workflows/build-apk.yml"

# Ce workflow ne fait que construire et deposer un artefact : upload-artifact
# n'a besoin d'aucun droit sur le contenu. `release-apk.yml`, qui publie,
# declare son propre `contents: write` de son cote.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mot_de_passe_vide: ${{ steps.identifiants.outputs.mot_de_passe_vide }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sans liste explicite, l'action installe « tools platform-tools » ;
      # le paquet « tools » n'existe plus dans le depot SDK depuis mi-septembre
      # 2026 et sdkmanager sort en erreur avant meme le build (run du 16/09,
      # alors que celui du 10/09 passait). On nomme ce dont l'AGP a besoin.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Zéro secret dans l'APK distribuée : en CI, aucun mot de passe n'est compilé dans
      # le bytecode (classes.dex). L'utilisateur saisit son mot de passe CMS une
      # fois directement dans l'application sur le téléphone (stocké en SharedPreferences),
      # ou via local.properties s'il compile en local sur son poste personnel.
      - name: Préparer local.properties (zéro secret compilé)
        id: identifiants
        run: |
          mkdir -p heldonica-mobile
          {
            echo "cms.baseUrl=https://www.heldonica.fr"
            echo "cms.password="
          } > heldonica-mobile/local.properties
          # Déclaration mesurée du build lui-même : le workflow de release refuse de
          # publier si ce n'est pas 'true'. Un APK publié ne se « dépublie » pas.
          echo "mot_de_passe_vide=true" >> "$GITHUB_OUTPUT"

      - name: Tests unitaires JVM (Kotlin)
        run: |
          cd heldonica-mobile
          gradle testDebugUnitTest --stacktrace

      # Keystore de release. Il est OBLIGATOIRE pour publier : une release ne se
      # signe plus avec le keystore de debug versionne, qui est public (constat du
      # 2026-10-20 : les 7 APK publies l'etaient, voir app/build.gradle.kts).
      #
      # En validation (pull_request / push), il est normalement absent : on
      # construit alors la variante release NON signee, uniquement pour verifier
      # que R8, proguard et lint compilent. Le verrou de publication est plus bas.
      #
      # « Normalement absent » etait faux sur une pull request, et c'etait le
      # trou : GitHub ne retient les secrets que pour les PR venant d'un fork.
      # Pour une branche poussee dans le depot — ce que font tous les agents
      # d'ici — le keystore et ses mots de passe etaient bien fournis, et
      # `gradle assembleRelease` execute le `build.gradle.kts` DE LA BRANCHE DE
      # LA PR. Un `doFirst {}` ajoute la suffisait a exfiltrer la cle de
      # signature. Qui la tient signe des APK qui s'installent par-dessus les
      # tiennes. Ils ne sont donc plus fournis sur `pull_request`.
      #
      # Ce verrou ne suffit pas a lui seul : la branche de la PR controle aussi
      # ce fichier. La protection complete demande de deplacer ces quatre
      # secrets dans un « Environment » GitHub restreint aux tags de release.
      # Voir `docs/SECURITE_CI.md`.
      - name: Poser le keystore de release (si fourni)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ github.event_name == 'pull_request' && '' || secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p heldonica-mobile/keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > heldonica-mobile/keystore/heldonica-release.keystore
            echo "keystore de release pose."
            echo "signe=true" >> "$GITHUB_OUTPUT"
          else
            echo "aucun keystore de release fourni : build de validation non signe."
            echo "signe=false" >> "$GITHUB_OUTPUT"
          fi

      # Verrou DUR : on refuse de produire l'APK destine a la publication sans
      # keystore de release. Seul l'appel de release-apk.yml pose `publier=true` ;
      # un build de validation (PR, push) reste non signe.
      - name: Refuser de publier sans keystore de release
        if: ${{ inputs.publier && steps.keystore.outputs.signe != 'true' }}
        run: |
          echo "::error::Publication refusee : RELEASE_KEYSTORE_BASE64 absent. Une release ne se signe plus avec le keystore de debug public (constat du 2026-10-20)."
          exit 1

      # Build RELEASE (non debogable, R8 actif, ressources reduites).
      # Le mot de passe CMS reste vide : aucun secret n'est compile dans le dex.
      # Signe si le keystore est pose ; sinon non signe (validation de CI).
      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ github.event_name == 'pull_request' && '' || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ github.event_name == 'pull_request' && '' || secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && '' || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd heldonica-mobile
          if [ "${{ steps.keystore.outputs.signe }}" = "true" ]; then
            gradle assembleRelease --stacktrace
          else
            gradle assembleRelease -PallowUnsignedRelease=true --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: heldonica-mobile-release
          path: heldonica-mobile/app/build/outputs/apk/release/*.apk
