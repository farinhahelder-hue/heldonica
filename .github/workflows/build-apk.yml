name: Build APK (Heldonica Mobile 0€)

on:
  workflow_dispatch:
  # Appelé par `release-apk.yml` pour produire l'APK publié. Le build est le même
  # que celui de la CI : `cms.password=` reste vide, donc aucun secret n'est compilé
  # dans le dex. `mot_de_passe_vide` est publié en sortie pour que le workflow
  # appelant puisse refuser de publier un APK qui aurait embarqué un identifiant.
  workflow_call:
    outputs:
      mot_de_passe_vide:
        description: "'true' si aucun mot de passe n'a été compilé dans l'APK"
        value: ${{ jobs.build.outputs.mot_de_passe_vide }}
  pull_request:
    paths:
      - "heldonica-mobile/**"
      - ".github/workflows/build-apk.yml"
  push:
    paths:
      - "heldonica-mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mot_de_passe_vide: ${{ steps.identifiants.outputs.mot_de_passe_vide }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sans liste explicite, l'action installe « tools platform-tools » ;
      # le paquet « tools » n'existe plus dans le depot SDK depuis mi-septembre
      # 2026 et sdkmanager sort en erreur avant meme le build (run du 16/09,
      # alors que celui du 10/09 passait). On nomme ce dont l'AGP a besoin.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Zéro secret dans l'APK distribuée : en CI, aucun mot de passe n'est compilé dans
      # le bytecode (classes.dex). L'utilisateur saisit son mot de passe CMS une
      # fois directement dans l'application sur le téléphone (stocké en SharedPreferences),
      # ou via local.properties s'il compile en local sur son poste personnel.
      - name: Préparer local.properties (zéro secret compilé)
        id: identifiants
        run: |
          mkdir -p heldonica-mobile
          {
            echo "cms.baseUrl=https://www.heldonica.fr"
            echo "cms.password="
          } > heldonica-mobile/local.properties
          # Déclaration mesurée du build lui-même : le workflow de release refuse de
          # publier si ce n'est pas 'true'. Un APK publié ne se « dépublie » pas.
          echo "mot_de_passe_vide=true" >> "$GITHUB_OUTPUT"

      - name: Tests unitaires JVM (Kotlin)
        run: |
          cd heldonica-mobile
          gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: |
          cd heldonica-mobile
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: heldonica-mobile-debug
          path: heldonica-mobile/app/build/outputs/apk/debug/app-debug.apk
