name: Build APK (Heldonica Mobile 0€)

on:
  workflow_dispatch:
  # Réutilisable : « Release APK » l'appelle pour ne pas dupliquer la recette de
  # build (JDK, SDK, local.properties). Une seule copie de cette configuration
  # fragile — cf. le commentaire sur le paquet « tools » ci-dessous.
  workflow_call:
    inputs:
      # `release: true` demande un APK SANS secret, pour publication publique.
      # Un booléen, et pas une chaîne vide : `inputs.x || secrets.Y` retombe sur
      # le secret quand la chaîne est vide (une chaîne vide est falsy en GH
      # Expressions). Ce piège aurait fait embarquer le mot de passe dans l'APK
      # publié — le contraire de l'intention. Un booléen est sans ambiguïté.
      release:
        description: "true = APK de release, SANS secret (publiable publiquement)."
        required: false
        type: boolean
        default: false
    secrets:
      CMS_PASSWORD:
        required: false
  push:
    paths:
      - "heldonica-mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sans liste explicite, l'action installe « tools platform-tools » ;
      # le paquet « tools » n'existe plus dans le depot SDK depuis mi-septembre
      # 2026 et sdkmanager sort en erreur avant meme le build (run du 16/09,
      # alors que celui du 10/09 passait). On nomme ce dont l'AGP a besoin.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Préparer local.properties
        # Un APK de release ne doit porter AUCUN secret : `CMS_PASSWORD` serait
        # compilé en clair dans le dex (buildConfigField String), et le dépôt est
        # public. `release: true` force donc un mot de passe vide, et le secret
        # n'est même pas lu. Sinon, on utilise le secret du dépôt (builds internes).
        env:
          CMS_PASSWORD: ${{ inputs.release && '' || secrets.CMS_PASSWORD }}
        run: |
          if [ -z "$CMS_PASSWORD" ]; then
            echo "::warning title=APK sans identifiants::Ajoute le secret CMS_PASSWORD (Settings > Secrets and variables > Actions). Sans lui l'APK se construit mais ne peut pas publier."
          fi
          mkdir -p heldonica-mobile
          {
            echo "cms.baseUrl=https://www.heldonica.fr"
            echo "cms.password=$CMS_PASSWORD"
          } > heldonica-mobile/local.properties

      - name: Build Debug APK
        run: |
          cd heldonica-mobile
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: heldonica-mobile-debug
          path: heldonica-mobile/app/build/outputs/apk/debug/app-debug.apk
