name: Build APK (Heldonica Mobile 0€)

on:
  workflow_dispatch:
  push:
    paths:
      - "heldonica-mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Init Gradle wrapper (if missing)
        run: |
          if [ ! -f heldonica-mobile/gradlew ]; then
            cd heldonica-mobile
            gradle wrapper --gradle-version 8.7 || (apt-get update && apt-get install -y gradle && gradle wrapper --gradle-version 8.7)
          fi
      - name: Build Debug APK
        run: |
          cd heldonica-mobile
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: heldonica-mobile-debug
          path: heldonica-mobile/app/build/outputs/apk/debug/app-debug.apk
