name: Erreur d'hydratation (dev)

# Lance le site en mode développement et ouvre une page pour lire l'erreur React
# non minifiée (ex. #418 sur /destinations/carte). Manuel, ou à chaque push de claude/captures-visuelles.

on:
  workflow_dispatch:
    inputs:
      chemin:
        description: "Chemin à ouvrir"
        required: true
        default: /destinations/carte
  push:
    branches: [claude/captures-visuelles]

permissions:
  contents: read

jobs:
  hydratation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lecture de l'erreur
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHEMIN: ${{ github.event.inputs.chemin || '/destinations/carte' }}
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          cp scripts/lire-hydratation.mjs lire.mjs
          npx next dev -p 3100 > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3100/ >/dev/null && break; sleep 2; done
          node lire.mjs | tee erreurs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydratation
          path: |
            erreurs.txt
            dev.log
          retention-days: 7
