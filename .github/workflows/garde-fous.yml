# Garde-fous du CMS.
#
# Ces contrôles existaient déjà comme scripts npm, mais rien ne les exécutait :
# ils ne tournaient que lancés à la main. C'est ainsi que deux commits de
# 11 000 lignes ont atterri sur `main` le 01/08 sans qu'aucune vérification ne
# passe — les régressions ont été découvertes le lendemain.
#
# Ce workflow les rend obligatoires sur chaque pull request et chaque push.

name: Garde-fous

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24, comme en local. En 20, `npm ci` échoue avant même les
          # contrôles : @supabase/auth-js exige Node >= 22.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

      # Aucun workflow n'executait la suite de tests : 20 des 356 avaient pourri
      # sans que personne ne le voie, dont les onze de l'authentification du CMS,
      # qui comparaient une promesse a un booleen. Un test qui ne tourne pas ne
      # protege rien.
      - name: Tests
        run: npx vitest run

  cms:
    name: Zones et tables CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Les deux contrôles interrogent Supabase. Sans identifiants ils sortent
      # en 2 — on préfère un avertissement explicite dans l'onglet Actions à un
      # échec cryptique, mais surtout pas un succès silencieux.
      - name: Vérifier la présence des identifiants
        id: secrets
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "presents=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Garde-fous CMS inactifs::Ajouter les secrets NEXT_PUBLIC_SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY dans Settings > Secrets and variables > Actions. Sans eux, les zones orphelines et les dérives de tables ne sont pas détectées."
          else
            echo "presents=true" >> "$GITHUB_OUTPUT"
          fi

      # Zones actives qu'aucun composant n'affiche, et clés lues mais absentes
      # du filtre serveur CONSUMED_ZONE_KEYS.
      - name: Zones orphelines
        if: steps.secrets.outputs.presents == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:cms-zones

      # Gestionnaires d'API maniant la clé service — qui contourne les règles de
      # sécurité de la base — sans vérifier qui les appelle. Deux trous de cette
      # forme ont été trouvés à la main le 3 septembre 2026 : la file Instagram,
      # entièrement ouverte, et le POST de /api/jules, qui laissait n'importe qui
      # faire écrire du code dans le dépôt. Les deux étaient latents, masqués par
      # une table absente et une variable non renseignée.
      # Sans secret : ce contrôle lit le code, pas la base.
      - name: Routes sans vérification
        run: npm run check:api-auth

      # Identifiants de modèles d'IA écrits en dur. Un modèle meurt sans
      # prévenir : Groq a retiré les Llama 3.x, Google Gemini 1.5 puis 2.0, et
      # le 21 septembre 2026 toutes les fonctions IA du panneau échouaient
      # depuis des mois sans qu'un écran le dise. Les identifiants vivent dans
      # lib/ai-provider.ts, seul endroit vérifié. Sans clé, le script ne teste
      # pas les fournisseurs : il refuse seulement la dérive dans le code.
      - name: Modèles d'IA en dur
        run: npm run check:ai-models

      # Écritures en base dont l'erreur n'est jamais lue. Supabase ne lève pas :
      # il rend { data, error }. Sans nommer `error`, un échec devient un `data`
      # null et l'appelant annonce une réussite. Cinq bugs de cette forme le
      # 3 septembre 2026, chacun caché par le précédent — le symptôme étant
      # toujours « rien ne se passe » ou « c'est fait » alors que rien n'est fait.
      - name: Erreurs avalées
        run: npm run check:erreurs-avalees

      # Tables référencées par le code mais absentes du schéma, et inversement.
      - name: Dérive des tables
        if: steps.secrets.outputs.presents == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:cms-drift

      # Tables référencées par le code sans migration versionnée. Ce contrôle
      # ne lit QUE le dépôt : pas de secret, donc pas de `if:` qui pourrait le
      # sauter et le faire passer pour vert sans qu'il ait tourné. C'est la
      # leçon du commit a48552a (2026-10-10) : 9 tables jamais migrées sont
      # passées parce que le contrôle qui les aurait vues dépendait de secrets
      # absents et se contentait d'un avertissement.
      - name: Tables sans migration
        run: npm run check:cms-migrations

      # Fenetre de revalidation des pages qui lisent le CMS. Statique, comme
      # check:cms-migrations : il lit les fichiers du depot, pas la base. Il existait
      # dans scripts/garde-fous.mjs depuis sa creation mais n etait cable dans aucun
      # workflow : 119 pages etaient verifiees en local, jamais en CI.
      - name: Fenetre de revalidation des pages CMS
        run: npm run check:cms-cache

      # Modules critiques absents et retard sur origin/main. Le 10/10, huit
      # fichiers référencés par le code n'ont jamais été committés : ils
      # n'existaient que sur la machine de l'auteur. Ce contrôle les voit sans
      # compiler. Sans secret.
      - name: Espace de travail
        run: npm run check:workspace

      # Parité de la voix de marque TypeScript ↔ Python. Documentée dans
      # AGENTS.md depuis des mois, mais le script n'avait jamais été committé :
      # le contrôle ne tournait donc nulle part. Sans secret.
      - name: Parité voix de marque
        run: npm run check:brand-sync

      # Cohérence éditoriale et respect des 7 garde-fous (pronoms, mots bannis, E-E-A-T)
      - name: Cohérence éditoriale et lexique
        if: steps.secrets.outputs.presents == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:content-coherence

      # Le contrôle ci-dessus mesure la *ressemblance* avec du vécu : son critère
      # E-E-A-T est satisfait par la seule présence de « en 202… », si bien qu'un
      # texte inventé de bout en bout obtient 100 %. Celui-ci vérifie l'inverse —
      # que chaque date et chaque lieu revendiqué soit attesté par les
      # métadonnées d'une photo du voyage (content/evidence/*.json).
      - name: Vécu adossé aux photos
        run: npm run check:content-evidence

      # Mots bannis et fragments de brouillon dans les pages statiques
      # (destinations, guides, travel-planning, LeadMagnetBlock). Statique :
      # ni secret, ni `if:` — il ne peut sauter silencieusement ni passer pour
      # vert sans avoir tourné. C'est le contrôle qui a manqué aux 20 dérives
      # relevées le 18/10, toutes listées à la main par un audit.
      - name: Mots bannis des pages statiques
        run: npm run check:content-pages

      # Fautes de langue connues, corrigées en base, encore présentes dans le code.
      # Le 25/10, la base était propre mais /destinations/alentejo servait toujours
      # « Évoramonsaraz » — dans le JSON-LD FAQPage lu par Google. Les migrations
      # corrigent la base, pas les replis JSX. Statique : ni secret, ni `if:` — il ne
      # peut pas sauter silencieusement.
      - name: Fautes connues dans le code
        run: npm run check:content-known-errors

      # Chemins d'image locaux (`/images/…`) sans fichier dans `public/`.
      # Le 25/10, trois pages destinations Madère, la Suisse et la Roumanie
      # servaient un hero vide (ou un `image:` de JSON-LD en 404) : le chemin
      # référencé n'avait jamais été livré. Statique : ni secret, ni `if:`.
      - name: Chemins d'image locaux (fichiers dans public/)
        run: npm run check:image-paths

      # Manifeste C2PA des générateurs d'images. Le script existait dans CHECKS
      # depuis la PR #790 mais n'était câblé dans aucun workflow : vert en local,
      # absent en CI — le trou que le test « câble dans la CI » a attrapé.
      - name: Images générées dans public/ (C2PA)
        run: npm run check:cms-ai-images

      # Tics visuels « IA / SaaS » (cartes SaaS, rayons exagérés, emojis décoratifs).
      # Statique, comme check:content-pages : refuse les dérives de design system.
      - name: Tics visuels et emojis hors charte
        run: npm run check:design-tics

      # Le contrôle précédent lit les FICHIERS. Celui-ci lit la BASE : une zone
      # CMS peut porter un emoji absent de tout le code, et le rendu le prend tel
      # quel. Le 22/10, la purge #687 visait la plage 2600-27BF + 10000-1FAFF
      # alors que le détecteur couvre aussi 231A-231B, 23E9-23FF, 2B1B-2B1C,
      # 2B50 et 2B55 : le sablier « ⌛ » de highlight_2_emoji est tombé dans ce
      # trou, refusé par la CI sur les fichiers, jamais vu en base. La plage
      # vient du détecteur (source unique) pour que les deux ne divergent plus.
      - name: Emojis décoratifs en base
        if: steps.secrets.outputs.presents == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:cms-emojis

      # Guillemets échappés par un antislash dans une balise HTML au sein d'un
      # fichier SQL de contenu (`class=\"…\"`). Statique : le seed
      # sql/seed_cms_zones_complete.sql a produit ce défaut en base le 24/10,
      # il ne doit pas se reproduire.
      - name: Guillemets échappés dans les balises (SQL)
        run: npm run check:content-html-escapes

      # Tout texte visible des pages publiques se modifie depuis le CMS. Le
      # contrôle fige, fichier par fichier, le nombre de textes encore écrits
      # en dur (scripts/cms-hardcode-baseline.json) et refuse toute hausse.
      # Statique, comme le précédent : il ne peut pas sauter faute de secret.
      - name: Texte en dur hors CMS (cliquet)
        run: npm run check:cms-hardcode

      # Une release Android ne se signe jamais avec le keystore de debug public
      # du depot (constat du 2026-10-20 : les 7 APK publies l'etaient). Statique,
      # il ne peut pas sauter faute de secret.
      - name: Signature APK (pas de cle de debug publique)
        run: npm run check:apk-signature
